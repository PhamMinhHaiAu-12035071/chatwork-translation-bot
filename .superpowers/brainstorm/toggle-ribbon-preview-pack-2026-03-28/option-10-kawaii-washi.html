<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Option 10 · Kawaii Washi Tape</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kiwi+Maru:wght@400;500&family=Shantell+Sans:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./shared.css">
  <style>
    /* ── Option 10: Kawaii Toggle + Washi Tape Ribbon ── */

    /* Toggle: extra rounded, cute — has emoji-style dot */
    [data-variant="kawaii-washi"] .tog-track {
      width: 56px;
      height: 30px;
      border-radius: 999px;
      border: 3px solid var(--ink);
      box-shadow: 3px 3px 0 var(--ink),
                  inset 0 3px 8px rgba(255,255,255,0.65),
                  inset 0 -3px 5px rgba(0,0,0,0.06);
      overflow: visible;
    }

    [data-variant="kawaii-washi"] .tog-track[data-live="true"] {
      background: #86efac; /* softer green, more kawaii */
      box-shadow: 3px 3px 0 #16a34a,
                  inset 0 3px 8px rgba(255,255,255,0.55);
    }

    [data-variant="kawaii-washi"] .tog-thumb {
      width: 22px;
      height: 22px;
      left: 1px;
      background: white;
      border: 2.5px solid var(--ink);
      border-radius: 50%;
      /* Show ✿ or ‖ via background image hack using drop shadow */
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      line-height: 1;
      overflow: hidden;
      /* Cannot put real text in pseudo-element easily, use emoji via content trick below */
    }

    [data-variant="kawaii-washi"] .tog-thumb::after {
      content: '✦';
      font-size: 9px;
      color: var(--ink);
      position: absolute;
      transition: opacity 200ms ease, transform 200ms ease;
    }

    [data-variant="kawaii-washi"] .tog-track[data-live="false"] .tog-thumb::after {
      content: '‖';
      font-size: 9px;
      color: #9ca3af;
    }

    [data-variant="kawaii-washi"] .tog-track[data-live="true"] .tog-thumb {
      left: 29px; /* 56 - 3 - 3 - 22 - 1 = 27, add 2 for feel = 29 */
      border-color: #15803d;
    }

    /* Washi tape: translucent tape strip, angled, over top-left corner */
    [data-variant="kawaii-washi"] .room-card {
      overflow: visible;
    }

    [data-variant="kawaii-washi"] .ribbon {
      position: absolute;
      top: -8px;
      left: 10px;
      padding: 7px 20px;
      transform: rotate(-3deg);
      transform-origin: center center;
      font-family: var(--font-heading);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      z-index: 4;
      border: 2px solid var(--ink);
      border-radius: 4px;
      min-width: 80px;
      text-align: center;
      /* Washi tape: semi-transparent + subtle texture */
      opacity: 0.92;
      background-image: repeating-linear-gradient(
        45deg,
        rgba(255,255,255,0.25) 0px,
        rgba(255,255,255,0.25) 3px,
        transparent 3px,
        transparent 9px
      );
      box-shadow:
        1px 1px 0 rgba(0,0,0,0.12),
        0 2px 8px rgba(0,0,0,0.08);
      transition: background-color 280ms ease, transform 280ms cubic-bezier(0.34, 1.3, 0.64, 1);
    }

    [data-variant="kawaii-washi"] .ribbon[data-live="true"] {
      background-color: rgba(187, 247, 208, 0.85);
      color: #14532d;
      transform: rotate(-3deg);
      border-color: #16a34a;
    }

    [data-variant="kawaii-washi"] .ribbon[data-live="false"] {
      background-color: rgba(243, 244, 246, 0.85);
      color: #374151;
      transform: rotate(1deg); /* different tilt when off */
    }

    /* Washi tape tearing effect on change */
    [data-variant="kawaii-washi"] .ribbon-text.ribbon-change {
      animation: washi-peel 220ms ease both;
    }

    @keyframes washi-peel {
      0%   { transform: scaleX(1) translateY(0);  opacity: 1; }
      40%  { transform: scaleX(0.7) translateY(3px); opacity: 0.5; }
      100% { transform: scaleX(0) translateY(6px);   opacity: 0; }
    }

    /* Heart decoration */
    [data-variant="kawaii-washi"] .ribbon::after {
      content: '✿';
      position: absolute;
      right: -10px;
      top: -8px;
      font-size: 14px;
      transform: rotate(15deg);
      filter: drop-shadow(1px 1px 0 rgba(0,0,0,0.15));
    }

    [data-variant="kawaii-washi"] .ribbon[data-live="true"]::after {
      content: '✦';
      color: #22c55e;
    }

    [data-variant="kawaii-washi"] .ribbon[data-live="false"]::after {
      content: '✿';
      color: #9ca3af;
    }

    /* Room head offset */
    [data-variant="kawaii-washi"] .room-head {
      padding-top: 42px;
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    window.TOGGLE_RIBBON_PREVIEW = {
      index: '10',
      title: 'Kawaii Washi Tape',
      summary: 'Toggle cute nhất với ✦ và ‖ icon thay cho blank thumb — ngay lập tức thấy ON/OFF bằng icon. Ribbon là washi tape semi-transparent dán chéo góc, thay đổi góc nghiêng theo state. Vui nhất trong pack.',
      intensity: 'High',
      shipRisk: 'Medium',
      riskTone: 'medium',
      variant: 'kawaii-washi',
      liveLabel: '✦ Live',
      pausedLabel: '‖ Paused',
      ribbonPosition: 'absolute',
      previewNote: '✦ Charming và unique nhất. Washi tape aesthetic rất phù hợp với "kawaii" trong design direction. Ribbon thay đổi góc nghiêng khi state đổi — micro-detail rất thú vị.',
      translationHint: 'Toggle thumb: ::after pseudo với content emoji. Washi tape: semi-transparent background + repeating-linear-gradient. Framer Motion: rotate variant khi toggle. reducedMotion: skip washi tilt.',
      prev: './option-09-float-glow.html',
      next: './option-01-clay-ios-sticker.html',
      buildRibbonHtml: function(live) {
        const text = live ? '✦ Live' : '‖ Paused';
        return `<div class="ribbon" data-role="ribbon" data-live="${live}">
          <span class="ribbon-text" data-role="ribbon-text">${text}</span>
        </div>`;
      }
    }
  </script>
  <script src="./shared.js"></script>
</body>
</html>
