<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Option 03 · Raised 3D + Tape Strip</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kiwi+Maru:wght@400;500&family=Shantell+Sans:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./shared.css">
  <style>
    /* ── Option 03: Raised 3D Toggle + Top Tape Strip ── */

    /* Toggle: deeper shadow, raised feel */
    [data-variant="raised-tape-strip"] .tog-track {
      box-shadow: 5px 5px 0 var(--ink),
                  inset 0 3px 8px rgba(255,255,255,0.6),
                  inset 0 -3px 6px rgba(0,0,0,0.08);
    }

    [data-variant="raised-tape-strip"] .tog-track[data-live="true"] {
      background: var(--mint-on);
      box-shadow: 5px 5px 0 #15803d,
                  inset 0 3px 8px rgba(255,255,255,0.45),
                  inset 0 -3px 6px rgba(0,0,0,0.08);
    }

    [data-variant="raised-tape-strip"] .tog-wrap:active .tog-track {
      box-shadow: 2px 2px 0 var(--ink);
      transform: translate(3px, 3px);
    }

    [data-variant="raised-tape-strip"] .tog-wrap {
      transition: transform 120ms ease;
    }

    /* Tape strip: full-width strip just above room-head */
    [data-variant="raised-tape-strip"] .room-card {
      padding-top: 0;
    }

    [data-variant="raised-tape-strip"] .ribbon {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: calc(100% + 40px);   /* extend beyond card padding */
      margin: 0 -20px 14px -20px;
      padding: 8px 20px;
      border-bottom: 3px solid var(--ink);
      font-family: var(--font-heading);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      transition: background 260ms ease, color 200ms ease;
      border-radius: 20px 20px 0 0;
      /* Tape texture */
      background-image: repeating-linear-gradient(
        90deg,
        rgba(255,255,255,0.12) 0px,
        rgba(255,255,255,0.12) 4px,
        transparent 4px,
        transparent 12px
      );
    }

    [data-variant="raised-tape-strip"] .ribbon[data-live="true"] {
      background-color: #bbf7d0;
      color: #14532d;
      border-color: #16a34a;
    }

    [data-variant="raised-tape-strip"] .ribbon[data-live="false"] {
      background-color: #e5e7eb;
      color: #374151;
    }

    /* Dot indicator in tape */
    [data-variant="raised-tape-strip"] .ribbon::before {
      content: '';
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      border: 2px solid currentColor;
      flex-shrink: 0;
    }

    [data-variant="raised-tape-strip"] .ribbon[data-live="true"]::before {
      background: #16a34a;
      border-color: #15803d;
      box-shadow: 0 0 6px rgba(22,163,74,0.6);
    }

    [data-variant="raised-tape-strip"] .ribbon[data-live="false"]::before {
      background: #9ca3af;
      border-color: #6b7280;
    }

    /* Slide animation */
    [data-variant="raised-tape-strip"] .ribbon-text.ribbon-change {
      animation: tape-slide 200ms cubic-bezier(0.3,1,0.6,1) both;
    }

    @keyframes tape-slide {
      0%  { opacity: 1; transform: translateY(0); }
      100%{ opacity: 0; transform: translateY(-8px); }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    window.TOGGLE_RIBBON_PREVIEW = {
      index: '03',
      title: 'Raised 3D + Tape Strip',
      summary: 'Toggle nổi hẳn lên khỏi mặt card nhờ shadow 5px sâu, cảm giác như nút vật lý có thể bấm vào. Ribbon là băng dán chạy ngang toàn bộ cạnh trên card — đơn giản, đọc ngay được từ xa.',
      intensity: 'Low+',
      shipRisk: 'Low',
      riskTone: 'safe',
      variant: 'raised-tape-strip',
      liveLabel: 'Live',
      pausedLabel: 'Paused',
      ribbonPosition: 'top-strip',
      previewNote: '✦ Tape strip phù hợp nhất nếu muốn layout tối giản và clean. Top strip là pattern phổ biến trong admin dashboards.',
      translationHint: 'Toggle: chỉ tăng box-shadow depth. Ribbon: negative margin trick để full-bleed. Không cần overflow:hidden. reducedMotion safe.',
      prev: './option-02-fat-pill-diagonal.html',
      next: './option-04-wide-bookmark.html',
      buildRibbonHtml: function(live) {
        const text = live ? 'Live' : 'Paused';
        return `<div class="ribbon" data-role="ribbon" data-live="${live}">
          <span class="ribbon-text" data-role="ribbon-text">${text}</span>
        </div>`;
      }
    }
  </script>
  <script src="./shared.js"></script>
</body>
</html>
