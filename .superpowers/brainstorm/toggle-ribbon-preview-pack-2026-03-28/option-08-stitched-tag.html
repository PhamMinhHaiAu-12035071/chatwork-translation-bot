<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Option 08 · Stitched Tag</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kiwi+Maru:wght@400;500&family=Shantell+Sans:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./shared.css">
  <style>
    /* ── Option 08: Stitched Toggle + Clothing Tag Ribbon ── */

    /* Toggle: dashed border — stitched look */
    [data-variant="stitched-tag"] .tog-track {
      border: 3px dashed var(--ink);
      border-radius: 999px;
      box-shadow: 3px 3px 0 var(--ink);
    }

    [data-variant="stitched-tag"] .tog-track[data-live="true"] {
      background: var(--mint-on);
      border-color: #15803d;
      box-shadow: 3px 3px 0 #15803d;
    }

    [data-variant="stitched-tag"] .tog-thumb {
      border: 2.5px solid var(--ink);
      box-shadow: 1px 1px 0 rgba(0,0,0,0.15);
    }

    /* Clothing tag: absolute top-left, slightly rotated, dashed border */
    [data-variant="stitched-tag"] .ribbon {
      position: absolute;
      top: 14px;
      left: 14px;
      padding: 8px 14px;
      border: 2.5px dashed var(--ink);
      border-radius: 10px;
      font-family: var(--font-heading);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      transform: rotate(-4deg);
      transform-origin: top left;
      z-index: 3;
      transition: background 260ms ease, color 200ms ease, transform 200ms ease;
      box-shadow: 2px 2px 0 var(--ink);
    }

    [data-variant="stitched-tag"] .ribbon[data-live="true"] {
      background: #bbf7d0;
      color: #14532d;
      border-color: #16a34a;
      box-shadow: 2px 2px 0 #16a34a;
      transform: rotate(-4deg);
    }

    [data-variant="stitched-tag"] .ribbon[data-live="false"] {
      background: #f9fafb;
      color: #374151;
      transform: rotate(-2deg);
    }

    /* Tag "punch hole" visual */
    [data-variant="stitched-tag"] .ribbon::before {
      content: '';
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      border: 2px dashed currentColor;
      margin-right: 6px;
      vertical-align: middle;
      opacity: 0.6;
    }

    /* Shimmer on change */
    [data-variant="stitched-tag"] .ribbon-text.ribbon-change {
      animation: tag-shimmer 220ms ease both;
    }

    @keyframes tag-shimmer {
      0%   { filter: blur(0); opacity: 1; }
      50%  { filter: blur(4px); opacity: 0.4; }
      100% { filter: blur(0); opacity: 0; }
    }

    /* Room head padding for tag */
    [data-variant="stitched-tag"] .room-head {
      padding-top: 46px;
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    window.TOGGLE_RIBBON_PREVIEW = {
      index: '08',
      title: 'Stitched Tag',
      summary: 'Toggle viền dashed như đường khâu may. Ribbon là nhãn vải (clothing tag) với viền dashed, nghiêng nhẹ như dán ngẫu hứng — handmade, kawaii, cực kỳ charming trong Clay style.',
      intensity: 'Medium',
      shipRisk: 'Low',
      riskTone: 'safe',
      variant: 'stitched-tag',
      liveLabel: '● Live',
      pausedLabel: '‖ Paused',
      ribbonPosition: 'absolute',
      previewNote: '✦ Charming nhất trong các options — cảm giác handcrafted rất phù hợp với Claymorphism. Dashed border đồng nhất giữa toggle và ribbon tạo cohesion tốt.',
      translationHint: 'Toggle: border-style dashed. Ribbon: absolute + rotate(-4deg). Shimmer dùng filter:blur trong Framer Motion. reducedMotion safe (tắt filter blur).',
      prev: './option-07-retro-ticker.html',
      next: './option-09-float-glow.html',
      buildRibbonHtml: function(live) {
        const text = live ? '● Live' : '‖ Paused';
        return `<div class="ribbon" data-role="ribbon" data-live="${live}">
          <span class="ribbon-text" data-role="ribbon-text">${text}</span>
        </div>`;
      }
    }
  </script>
  <script src="./shared.js"></script>
</body>
</html>
