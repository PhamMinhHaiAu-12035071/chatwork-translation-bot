<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Option 06 · Rubber Squish + Dog-ear Fold</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kiwi+Maru:wght@400;500&family=Shantell+Sans:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./shared.css">
  <style>
    /* ── Option 06: Rubber Squish Toggle + Dog-ear Fold ── */

    /* Toggle: rubber squish with spring snap */
    [data-variant="rubber-dogear"] .tog-track {
      box-shadow: 3px 3px 0 var(--ink),
                  inset 0 2px 6px rgba(255,255,255,0.55);
    }

    [data-variant="rubber-dogear"] .tog-track[data-live="true"] {
      background: var(--mint-on);
      box-shadow: 3px 3px 0 #16a34a,
                  inset 0 2px 6px rgba(255,255,255,0.4);
    }

    /* Rubber squish: track squishes horizontally when pressed */
    [data-variant="rubber-dogear"] .tog-wrap:active .tog-track {
      transform: scaleX(0.9) scaleY(1.06);
      transition: transform 80ms ease;
    }

    [data-variant="rubber-dogear"] .tog-wrap {
      transition: transform 220ms cubic-bezier(0.34, 1.6, 0.64, 1);
    }

    /* Thumb has a spring snap */
    [data-variant="rubber-dogear"] .tog-thumb {
      transition: left 280ms cubic-bezier(0.34, 2.0, 0.64, 1);
    }

    /* Dog-ear fold: CSS-only folded corner at top-right */
    [data-variant="rubber-dogear"] .room-card {
      overflow: visible;
      position: relative;
    }

    /* The dog-ear is created using a pseudo-overlay in the corner */
    [data-variant="rubber-dogear"] .ribbon {
      position: absolute;
      top: -3px; /* align with card border */
      left: -3px;
      width: 0;
      height: 0;
      border-style: solid;
      border-width: 52px 52px 0 0; /* triangle size */
      border-color: transparent transparent transparent transparent;
      border-radius: 20px 0 0 0;
      z-index: 4;
      font-size: 0; /* no visible text in the triangle itself */
      transition: border-color 260ms ease;
      display: block;
      padding: 0;
      gap: 0;
    }

    [data-variant="rubber-dogear"] .ribbon[data-live="true"] {
      border-top-color: var(--mint-on);
      border-left-color: var(--mint-on);
      filter: drop-shadow(2px 2px 0 #16a34a);
    }

    [data-variant="rubber-dogear"] .ribbon[data-live="false"] {
      border-top-color: #e5e7eb;
      border-left-color: #e5e7eb;
      filter: drop-shadow(2px 2px 0 #9ca3af);
    }

    /* Text inside dog-ear — rotate to fit corner */
    [data-variant="rubber-dogear"] .ribbon-text {
      position: absolute;
      top: -44px;
      left: 3px;
      width: 38px;
      font-family: var(--font-heading);
      font-size: 9px;
      font-weight: 800;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      transform: rotate(-45deg);
      transform-origin: center center;
      text-align: center;
      line-height: 1;
      color: var(--ink);
    }

    [data-variant="rubber-dogear"] .ribbon[data-live="true"] .ribbon-text {
      color: #14532d;
    }

    [data-variant="rubber-dogear"] .ribbon[data-live="false"] .ribbon-text {
      color: #374151;
    }

    /* Dog-ear unfold animation */
    [data-variant="rubber-dogear"] .ribbon-text.ribbon-change {
      animation: dogear-flip 200ms ease both;
    }

    @keyframes dogear-flip {
      0%   { opacity: 1; transform: rotate(-45deg) scale(1); }
      50%  { opacity: 0.3; transform: rotate(-45deg) scale(0.7); }
      100% { opacity: 0;   transform: rotate(-45deg) scale(0.5); }
    }

    /* Room head extra padding for dog-ear */
    [data-variant="rubber-dogear"] .room-head {
      padding-left: 44px;
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    window.TOGGLE_RIBBON_PREVIEW = {
      index: '06',
      title: 'Rubber Squish + Dog-ear Fold',
      summary: 'Toggle có cảm giác rubber/đàn hồi khi bấm — track xẹp lại rồi snap back với spring. Ribbon là góc gập (dog-ear) tam giác góc trên trái card, giống tờ giấy bị gập. Rất tactile.',
      intensity: 'Medium+',
      shipRisk: 'Medium',
      riskTone: 'medium',
      variant: 'rubber-dogear',
      liveLabel: 'ON',
      pausedLabel: 'OFF',
      ribbonPosition: 'absolute',
      previewNote: '✦ Cảm giác physical nhất trong tất cả options. Dog-ear corner là detail nhỏ nhưng tạo character rất riêng. Ship risk medium vì cần test cross-browser với CSS border triangle.',
      translationHint: 'Toggle: spring cubic-bezier(0.34, 2.0, 0.64, 1) cho thumb. Ribbon: CSS border-triangle, không cần extra HTML. Framer Motion: toggle track có layoutId để spring giữa states.',
      prev: './option-05-square-stamp.html',
      next: './option-07-retro-ticker.html',
      buildRibbonHtml: function(live) {
        const text = live ? 'ON' : 'OFF';
        return `<div class="ribbon" data-role="ribbon" data-live="${live}">
          <span class="ribbon-text" data-role="ribbon-text">${text}</span>
        </div>`;
      }
    }
  </script>
  <script src="./shared.js"></script>
</body>
</html>
