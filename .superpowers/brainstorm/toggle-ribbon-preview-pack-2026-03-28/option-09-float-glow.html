<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Option 09 · Float Glow + Side Orb</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kiwi+Maru:wght@400;500&family=Shantell+Sans:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./shared.css">
  <style>
    /* ── Option 09: Floating Glow Toggle + Side Glow Orb ── */

    /* Toggle: elevated float with glow on-state */
    [data-variant="float-glow"] .tog-track {
      box-shadow:
        0 6px 20px rgba(0,0,0,0.18),
        0 2px 6px rgba(0,0,0,0.12),
        3px 3px 0 var(--ink);
      transition: background 300ms ease, box-shadow 300ms ease;
    }

    [data-variant="float-glow"] .tog-track[data-live="true"] {
      background: var(--mint-on);
      box-shadow:
        0 0 18px rgba(74, 222, 128, 0.55),
        0 0 40px rgba(74, 222, 128, 0.25),
        0 4px 12px rgba(0,0,0,0.14),
        3px 3px 0 #15803d;
    }

    /* Thumb glows slightly when on */
    [data-variant="float-glow"] .tog-track[data-live="true"] .tog-thumb {
      box-shadow: 0 0 8px rgba(255,255,255,0.8), 1px 1px 0 rgba(0,0,0,0.1);
    }

    /* Glow orb: side pill with glow aura */
    [data-variant="float-glow"] .ribbon {
      position: absolute;
      top: 18px;
      left: -4px;
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 7px 14px 7px 10px;
      border: 2.5px solid var(--ink);
      border-radius: 0 999px 999px 0;
      border-left: none;
      font-family: var(--font-heading);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      z-index: 3;
      transition: background 300ms ease, color 200ms ease, box-shadow 300ms ease;
    }

    [data-variant="float-glow"] .ribbon[data-live="true"] {
      background: #bbf7d0;
      color: #065f46;
      box-shadow:
        0 0 12px rgba(74, 222, 128, 0.45),
        3px 3px 0 #16a34a;
    }

    [data-variant="float-glow"] .ribbon[data-live="false"] {
      background: #f3f4f6;
      color: #374151;
      box-shadow: 3px 3px 0 var(--ink);
    }

    /* Orb dot indicator */
    [data-variant="float-glow"] .ribbon::before {
      content: '';
      display: inline-block;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      flex-shrink: 0;
      transition: background 300ms ease, box-shadow 300ms ease;
    }

    [data-variant="float-glow"] .ribbon[data-live="true"]::before {
      background: #22c55e;
      box-shadow: 0 0 6px rgba(34, 197, 94, 0.7), 0 0 14px rgba(34, 197, 94, 0.4);
      animation: orb-pulse 2s ease infinite;
    }

    [data-variant="float-glow"] .ribbon[data-live="false"]::before {
      background: #9ca3af;
      box-shadow: none;
      animation: none;
    }

    @keyframes orb-pulse {
      0%, 100% { box-shadow: 0 0 6px rgba(34,197,94,0.7), 0 0 14px rgba(34,197,94,0.4); }
      50%       { box-shadow: 0 0 12px rgba(34,197,94,0.9), 0 0 28px rgba(34,197,94,0.5); }
    }

    /* Glow pulse on change */
    [data-variant="float-glow"] .ribbon-text.ribbon-change {
      animation: glow-fade 200ms ease both;
    }

    @keyframes glow-fade {
      0%   { opacity: 1; filter: brightness(1); }
      100% { opacity: 0; filter: brightness(1.8); }
    }

    /* Room head padding for side orb */
    [data-variant="float-glow"] .room-head {
      padding-left: 68px;
    }

    /* Reduce motion: disable pulse */
    @media (prefers-reduced-motion: reduce) {
      [data-variant="float-glow"] .ribbon::before { animation: none !important; }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    window.TOGGLE_RIBBON_PREVIEW = {
      index: '09',
      title: 'Float Glow + Side Orb',
      summary: 'Toggle nổi hẳn lên với multi-layer shadow và phát sáng mint khi enabled — cảm giác premium, modern. Ribbon là pill nửa tròn bên trái với orb glowing và pulse animation khi live.',
      intensity: 'High',
      shipRisk: 'Medium',
      riskTone: 'medium',
      variant: 'float-glow',
      liveLabel: 'Live',
      pausedLabel: 'Paused',
      ribbonPosition: 'absolute',
      previewNote: '✦ Premium feel nhất. Glow effect cần prefers-reduced-motion check. Phù hợp nếu muốn dashboard có feel modern SaaS.',
      translationHint: 'Toggle: multi-layer box-shadow, Framer Motion animate shadow on state change. Orb pulse: CSS animation, tắt khi reducedMotion. Framer motion variants cho glow transition.',
      prev: './option-08-stitched-tag.html',
      next: './option-10-kawaii-washi.html',
      buildRibbonHtml: function(live) {
        const text = live ? 'Live' : 'Paused';
        return `<div class="ribbon" data-role="ribbon" data-live="${live}">
          <span class="ribbon-text" data-role="ribbon-text">${text}</span>
        </div>`;
      }
    }
  </script>
  <script src="./shared.js"></script>
</body>
</html>
