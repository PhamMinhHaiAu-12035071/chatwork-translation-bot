<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Option 04 · Wide Slider + Bookmark Tab</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kiwi+Maru:wght@400;500&family=Shantell+Sans:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./shared.css">
  <style>
    /* ── Option 04: Wide Slider + Left Bookmark Tab ── */

    /* Toggle: wider track — iPad OS feel */
    [data-variant="wide-bookmark"] .tog-track {
      width: 64px;
      height: 30px;
      box-shadow: 3px 3px 0 var(--ink),
                  inset 0 2px 6px rgba(255,255,255,0.55);
    }

    [data-variant="wide-bookmark"] .tog-track[data-live="true"] {
      background: var(--mint-on);
      box-shadow: 3px 3px 0 #16a34a,
                  inset 0 2px 6px rgba(255,255,255,0.4);
    }

    [data-variant="wide-bookmark"] .tog-thumb {
      width: 20px;
      height: 20px;
      left: 3px;
    }

    [data-variant="wide-bookmark"] .tog-track[data-live="true"] .tog-thumb {
      left: 37px; /* 64 - 3 - 3 - 20 - 1 = 37 */
    }

    /* Bookmark tab on left edge */
    [data-variant="wide-bookmark"] .room-card {
      padding-left: 44px;
    }

    [data-variant="wide-bookmark"] .ribbon {
      position: absolute;
      left: -3px; /* slight overlap with border */
      top: 24px;
      width: 36px;
      padding: 24px 8px;
      border: 3px solid var(--ink);
      border-right: none;
      border-radius: 10px 0 0 10px;
      font-family: var(--font-heading);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      writing-mode: vertical-rl;
      text-orientation: mixed;
      transform: rotate(180deg);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 3;
      box-shadow: -3px 3px 0 var(--ink);
      transition: background 260ms ease, color 200ms ease, box-shadow 200ms ease;
    }

    [data-variant="wide-bookmark"] .ribbon[data-live="true"] {
      background: #bbf7d0;
      color: #14532d;
      box-shadow: -3px 3px 0 #16a34a;
    }

    [data-variant="wide-bookmark"] .ribbon[data-live="false"] {
      background: #f3f4f6;
      color: var(--ink);
    }

    [data-variant="wide-bookmark"] .ribbon-text.ribbon-change {
      animation: bookmark-slide 200ms ease both;
    }

    @keyframes bookmark-slide {
      0%   { opacity: 1; transform: translateX(0); }
      100% { opacity: 0; transform: translateX(6px); }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    window.TOGGLE_RIBBON_PREVIEW = {
      index: '04',
      title: 'Wide Slider + Bookmark Tab',
      summary: 'Toggle rộng hơn chuẩn iOS, thumb di chuyển xa hơn nên trạng thái on/off rõ ràng hơn. Ribbon là tab folder nhô ra từ cạnh trái card — giống file folder trong tủ tài liệu.',
      intensity: 'Low',
      shipRisk: 'Low',
      riskTone: 'safe',
      variant: 'wide-bookmark',
      liveLabel: 'LIVE',
      pausedLabel: 'OFF',
      ribbonPosition: 'absolute',
      previewNote: '✦ Bookmark tab rất tốt cho UX có nhiều room cards — nhìn ngang list là biết ngay màu nào đang on/off. Giống pattern trong email clients.',
      translationHint: 'Toggle: tăng width, điều chỉnh thumb position. Ribbon: absolute positioning, padding-left card. Không cần overflow:hidden. reducedMotion safe.',
      prev: './option-03-raised-tape-strip.html',
      next: './option-05-square-stamp.html',
      buildRibbonHtml: function(live) {
        const text = live ? 'LIVE' : 'OFF';
        return `<div class="ribbon" data-role="ribbon" data-live="${live}">
          <span class="ribbon-text" data-role="ribbon-text">${text}</span>
        </div>`;
      }
    }
  </script>
  <script src="./shared.js"></script>
</body>
</html>
