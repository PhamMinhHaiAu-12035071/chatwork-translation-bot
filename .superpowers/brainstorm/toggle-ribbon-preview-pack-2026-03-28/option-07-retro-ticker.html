<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Option 07 · Retro Pixel + Ticker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kiwi+Maru:wght@400;500&family=Shantell+Sans:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./shared.css">
  <style>
    /* ── Option 07: Retro Toggle + Horizontal Ticker ── */

    /* Toggle: retro/pixel aesthetic — dashed border, monospace feel */
    [data-variant="retro-ticker"] .tog-track {
      border: 3px solid var(--ink);
      border-radius: 8px; /* more squared off */
      box-shadow: 3px 3px 0 var(--ink);
      background: repeating-linear-gradient(
        -45deg,
        rgba(0,0,0,0.04) 0px, rgba(0,0,0,0.04) 2px,
        transparent 2px, transparent 6px
      ), var(--gray-off);
    }

    [data-variant="retro-ticker"] .tog-track[data-live="true"] {
      background: repeating-linear-gradient(
        -45deg,
        rgba(0,0,0,0.04) 0px, rgba(0,0,0,0.04) 2px,
        transparent 2px, transparent 6px
      ), var(--mint-on);
      box-shadow: 3px 3px 0 #15803d;
    }

    [data-variant="retro-ticker"] .tog-thumb {
      border-radius: 4px; /* square thumb for retro */
      background: #fff;
      width: 16px;
      height: 16px;
      top: 3px;
    }

    [data-variant="retro-ticker"] .tog-track[data-live="true"] .tog-thumb {
      left: 32px;
    }

    /* Ticker: animates in from right, sits at very top of card */
    [data-variant="retro-ticker"] .room-card {
      padding-top: 0;
      overflow: hidden;
    }

    [data-variant="retro-ticker"] .ribbon {
      display: flex;
      align-items: center;
      gap: 10px;
      width: calc(100% + 40px);
      margin: 0 -20px 14px -20px;
      padding: 9px 20px;
      border-bottom: 3px solid var(--ink);
      overflow: hidden;
      font-family: 'Courier New', monospace;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      border-radius: 20px 20px 0 0;
      position: relative;
      transition: background 250ms ease;
    }

    [data-variant="retro-ticker"] .ribbon[data-live="true"] {
      background: #bbf7d0;
      color: #065f46;
      border-color: #16a34a;
    }

    [data-variant="retro-ticker"] .ribbon[data-live="false"] {
      background: #f3f4f6;
      color: #374151;
    }

    /* Blinking dot */
    [data-variant="retro-ticker"] .ribbon::before {
      content: '▶';
      font-size: 10px;
      flex-shrink: 0;
      animation: blink-dot 1s steps(1) infinite;
    }

    [data-variant="retro-ticker"] .ribbon[data-live="false"]::before {
      content: '■';
      animation: none;
      opacity: 0.5;
    }

    @keyframes blink-dot {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0; }
    }

    /* Ticker slide animation */
    [data-variant="retro-ticker"] .ribbon-text.ribbon-change {
      animation: ticker-out 200ms ease both;
    }

    @keyframes ticker-out {
      0%   { opacity: 1; transform: translateX(0); }
      100% { opacity: 0; transform: translateX(-100%); }
    }

    /* scanline effect overlay */
    [data-variant="retro-ticker"] .ribbon::after {
      content: '';
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(0,0,0,0.025) 2px,
        rgba(0,0,0,0.025) 4px
      );
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    window.TOGGLE_RIBBON_PREVIEW = {
      index: '07',
      title: 'Retro Pixel + Ticker',
      summary: 'Toggle có texture pattern chéo và cạnh vuông hơn, gợi lên cảm giác UI terminal/retro. Ribbon là ticker strip chạy ngang đầu card với blinking dot và monospace font — như màn hình broadcast.',
      intensity: 'Medium',
      shipRisk: 'Medium',
      riskTone: 'medium',
      variant: 'retro-ticker',
      liveLabel: 'ROOM LIVE',
      pausedLabel: 'ROOM PAUSED',
      ribbonPosition: 'top-strip',
      previewNote: '✦ Option độc đáo nhất về character. Phù hợp nếu muốn brand feel tech-forward và playful. Blinking dot cần check reducedMotion.',
      translationHint: 'Toggle: CSS pattern background. Ribbon: monospace font + blink animation. Cần prefers-reduced-motion để tắt blink-dot. Ticker slide dùng Framer Motion translateX.',
      prev: './option-06-rubber-dogear.html',
      next: './option-08-stitched-tag.html',
      buildRibbonHtml: function(live) {
        const text = live ? 'ROOM LIVE' : 'ROOM PAUSED';
        return `<div class="ribbon" data-role="ribbon" data-live="${live}">
          <span class="ribbon-text" data-role="ribbon-text">${text}</span>
        </div>`;
      }
    }
  </script>
  <script src="./shared.js"></script>
</body>
</html>
