services:
  translator:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      ROOM_CONFIG_ENCRYPTION_KEY: ${ROOM_CONFIG_ENCRYPTION_KEY}
      KAGI_TRANSLATOR_URL: http://kagi-translator:3002
      KAGI_MAX_ENCODED_PAYLOAD_CHARS: ${KAGI_MAX_ENCODED_PAYLOAD_CHARS:-12000}
      KAGI_MAX_SEGMENT_COUNT: ${KAGI_MAX_SEGMENT_COUNT:-50}
      # Phase 1 Performance Optimizations
      USE_ASYNC_LOGGING: ${USE_ASYNC_LOGGING:-true}
      ENABLE_ASYNC_DELIVERY: ${ENABLE_ASYNC_DELIVERY:-false}
      ENABLE_HTTP_KEEPALIVE: ${ENABLE_HTTP_KEEPALIVE:-true}
      KEYWORD_PATTERN_CACHE_MAX: ${KEYWORD_PATTERN_CACHE_MAX:-100}
      ENABLE_KEYWORD_CACHE: ${ENABLE_KEYWORD_CACHE:-true}
      CHATWORK_API_FAILURE_THRESHOLD: ${CHATWORK_API_FAILURE_THRESHOLD:-5}
      CHATWORK_API_RESET_TIMEOUT_MS: ${CHATWORK_API_RESET_TIMEOUT_MS:-30000}
      LLM_PROVIDER_FAILURE_THRESHOLD: ${LLM_PROVIDER_FAILURE_THRESHOLD:-3}
      LLM_PROVIDER_RESET_TIMEOUT_MS: ${LLM_PROVIDER_RESET_TIMEOUT_MS:-60000}
    ports:
      - '${PORT:-3000}:3000'
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    networks: [chatwork-net]
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
        labels: "service,environment"
        tag: "{{.Name}}/{{.ID}}"
    labels:
      service: "translator"
      environment: "${NODE_ENV:-development}"
    healthcheck:
      test:
        - 'CMD'
        - 'bun'
        - '--eval'
        - "const r = await fetch('http://localhost:3000/health'); if (!r.ok) process.exit(1)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  kagi-translator:
    build:
      context: .
      dockerfile: Dockerfile.kagi
    env_file:
      - .env
    environment:
      KAGI_PORT: 3002
      KAGI_MIN_INTERVAL_MS: ${KAGI_MIN_INTERVAL_MS:-1500}
      KAGI_MAX_RETRIES: ${KAGI_MAX_RETRIES:-2}
      KAGI_RETRY_BASE_MS: ${KAGI_RETRY_BASE_MS:-1000}
      KAGI_REQUEST_TIMEOUT_MS: ${KAGI_REQUEST_TIMEOUT_MS:-30000}
      KAGI_MAX_QUEUE_DEPTH: ${KAGI_MAX_QUEUE_DEPTH:-10}
      KAGI_MAX_QUEUE_WAIT_MS: ${KAGI_MAX_QUEUE_WAIT_MS:-15000}
      DISPLAY: :99
    ports:
      - '${KAGI_PORT:-3002}:3002'
    restart: unless-stopped
    networks: [chatwork-net]
    healthcheck:
      test:
        - 'CMD'
        - 'bun'
        - '--eval'
        - "const r = await fetch('http://localhost:3002/health'); if (!r.ok) process.exit(1)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  webhook-logger:
    build:
      context: .
      dockerfile: Dockerfile.logger
    env_file:
      - .env
    environment:
      TRANSLATOR_URL: http://translator:3000
    ports:
      - '${LOGGER_PORT:-3001}:3001'
    restart: unless-stopped
    networks: [chatwork-net]
    depends_on:
      translator:
        condition: service_healthy

networks:
  chatwork-net:
    driver: bridge
