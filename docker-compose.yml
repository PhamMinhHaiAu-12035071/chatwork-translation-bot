services:
  translator:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      ROOM_CONFIG_ENCRYPTION_KEY: ${ROOM_CONFIG_ENCRYPTION_KEY}
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET}
    ports:
      - '${PORT:-3000}:3000'
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    networks: [chatwork-net]
    healthcheck:
      test:
        - 'CMD'
        - 'bun'
        - '--eval'
        - "const r = await fetch('http://localhost:3000/health'); if (!r.ok) process.exit(1)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  webhook-logger:
    build:
      context: .
      dockerfile: Dockerfile.logger
    env_file:
      - .env
    environment:
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET}
      TRANSLATOR_INTERNAL_URL: http://translator:3000
    ports:
      - '${LOGGER_PORT:-3001}:3001'
    restart: unless-stopped
    networks: [chatwork-net]
    depends_on:
      translator:
        condition: service_healthy

networks:
  chatwork-net:
    driver: bridge
