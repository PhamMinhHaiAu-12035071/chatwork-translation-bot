services:
  translator:
    image: oven/bun:1.3-alpine
    command:
      - sh
      - -c
      - bun install --frozen-lockfile && bun --hot packages/translator/src/index.ts
    working_dir: /app
    volumes:
      - .:/app
      # Anonymous volume prevents host node_modules from overriding container's
      - /app/node_modules
    env_file:
      - .env
    environment:
      # host.docker.internal resolves to macOS host on Docker Desktop
      - CURSOR_API_URL=http://host.docker.internal:8765/v1
      # Skip husky prepare hook during in-container install
      - HUSKY=0
    ports:
      - '${PORT:-3000}:3000'
    networks: [chatwork-net]
    # bun:1.3-alpine has wget, but use bun --eval for consistency with production
    healthcheck:
      test:
        - 'CMD'
        - 'bun'
        - '--eval'
        - "const r = await fetch('http://localhost:3000/health'); if (!r.ok) process.exit(1)"
      interval: 30s
      timeout: 10s
      retries: 3
      # First boot recreates anonymous /app/node_modules and runs bun install inside the container.
      # Give startup enough time so Compose does not mark the service unhealthy before the app listens.
      start_period: 180s

  webhook-logger:
    image: oven/bun:1.3-alpine
    command:
      - sh
      - -c
      - bun install --frozen-lockfile && bun --hot packages/webhook-logger/src/index.ts
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
    env_file:
      - .env
    environment:
      # Override localhost → Docker service name
      - TRANSLATOR_URL=http://translator:3000
      # Skip husky prepare hook during in-container install
      - HUSKY=0
    ports:
      - '${LOGGER_PORT:-3001}:3001'
    networks: [chatwork-net]
    depends_on:
      translator:
        condition: service_healthy
    healthcheck:
      test:
        - 'CMD'
        - 'bun'
        - '--eval'
        - "const r = await fetch('http://localhost:3001/health'); if (!r.ok) process.exit(1)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s

  dataset-runner:
    profiles: ['dataset']
    image: oven/bun:1.3-alpine
    command:
      - sh
      - -c
      - bun install --frozen-lockfile && sleep ${DATASET_RUNNER_START_DELAY:-35} && bun --hot packages/dataset-runner/src/index.ts
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
    env_file:
      - .env
    environment:
      - DATASET_AUTORUN=${DATASET_AUTORUN:-false}
      - HUSKY=0
    networks: [chatwork-net]
    depends_on:
      translator:
        condition: service_healthy
      webhook-logger:
        condition: service_healthy
    healthcheck:
      test:
        - 'CMD'
        - 'bun'
        - '--eval'
        - "const r = await fetch('http://localhost:3002/health'); if (!r.ok) process.exit(1)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s

  # zrok reserved public share — stable HTTPS URL for Chatwork webhook
  # One-time setup: see docs/operations/zrok.md
  # Pin to a specific version for reproducibility — check https://hub.docker.com/r/openziti/zrok/tags
  zrok:
    image: openziti/zrok:2.0.0-rc4
    networks: [chatwork-net]
    volumes:
      # Bind mount so host user owns the dir — named volumes create root-owned dirs
      - ./.docker/zrok:/home/ziggy/.zrok
    environment:
      - ZROK_API_ENDPOINT=https://api-v2.zrok.io
      - ZROK_ENABLE_TOKEN=${ZROK_ENABLE_TOKEN}
      - ZROK_UNIQUE_NAME=${ZROK_UNIQUE_NAME}
    entrypoint:
      - /bin/sh
      - -c
      - |
        [ -f /home/ziggy/.zrok/environment.json ] || zrok enable ${ZROK_ENABLE_TOKEN} --headless
        # Best-effort cleanup for stale share state from previous runs.
        existing_share_token=$$(zrok list names --namespace-token public --json 2>/dev/null | \
          grep -A 8 "\"name\": \"${ZROK_UNIQUE_NAME}\"" | \
          sed -n 's/.*"shareToken": "\(.*\)".*/\1/p' | \
          head -n 1)
        if [ -n "$$existing_share_token" ]; then
          echo "[zrok] unsharing stale token: $$existing_share_token"
          zrok unshare "$$existing_share_token" >/dev/null 2>&1 || true
        fi
        zrok share public http://webhook-logger:3001 --headless -n public:${ZROK_UNIQUE_NAME} 2>&1 | while IFS= read -r line; do
          echo "$$line"
          url=$$(echo "$$line" | grep -o '[a-zA-Z0-9-]*\.shares\.zrok\.io' 2>/dev/null)
          if [ -n "$$url" ]; then
            echo ""
            echo "============================================="
            echo " WEBHOOK URL : https://$${url}"
            echo " -> Chatwork : Webhook settings -> URL"
            echo "============================================="
            echo ""
          fi
        done
    depends_on:
      webhook-logger:
        condition: service_healthy

networks:
  chatwork-net:
    driver: bridge
