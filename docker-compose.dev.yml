services:
  translator:
    image: oven/bun:1.3-alpine
    command:
      - sh
      - -c
      - bun install --frozen-lockfile && bun --hot packages/translator/src/index.ts
    working_dir: /app
    volumes:
      - .:/app
      # Anonymous volume prevents host node_modules from overriding container's
      - /app/node_modules
    env_file:
      - .env
    environment:
      # host.docker.internal resolves to macOS host on Docker Desktop
      - CURSOR_API_URL=http://host.docker.internal:8765/v1
      # Skip husky prepare hook during in-container install
      - HUSKY=0
    ports:
      - '${PORT:-3000}:3000'
    restart: unless-stopped
    networks: [chatwork-net]
    # bun:1.3-alpine has wget, but use bun --eval for consistency with production
    healthcheck:
      test:
        - 'CMD'
        - 'bun'
        - '--eval'
        - "const r = await fetch('http://localhost:3000/health'); if (!r.ok) process.exit(1)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  webhook-logger:
    image: oven/bun:1.3-alpine
    command:
      - sh
      - -c
      - bun install --frozen-lockfile && bun --hot packages/webhook-logger/src/index.ts
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
    env_file:
      - .env
    environment:
      # Override localhost → Docker service name
      - TRANSLATOR_URL=http://translator:3000
      # Skip husky prepare hook during in-container install
      - HUSKY=0
    ports:
      - '${LOGGER_PORT:-3001}:3001'
    restart: unless-stopped
    networks: [chatwork-net]
    depends_on:
      translator:
        condition: service_healthy
    healthcheck:
      test:
        - 'CMD'
        - 'bun'
        - '--eval'
        - "const r = await fetch('http://localhost:3001/health'); if (!r.ok) process.exit(1)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Localtunnel with host fallback + auto-retry loop.
  tunnel:
    image: node:22-alpine
    restart: always
    networks: [chatwork-net]
    volumes:
      - ./scripts/run-localtunnel.sh:/usr/local/bin/run-localtunnel.sh:ro
    environment:
      - TUNNEL_PORT=${LOGGER_PORT:-3001}
      - TUNNEL_LOCAL_HOST=webhook-logger
      - TUNNEL_SUBDOMAIN=${TUNNEL_SUBDOMAIN:-chatwork-logger}
      - TUNNEL_HOSTS=${TUNNEL_HOSTS:-https://localtunnel.me https://loca.lt}
      - TUNNEL_RETRY_SECONDS=${TUNNEL_RETRY_SECONDS:-3}
      - NPM_CONFIG_UPDATE_NOTIFIER=false
      - NPM_CONFIG_FUND=false
      - NPM_CONFIG_AUDIT=false
    command: sh /usr/local/bin/run-localtunnel.sh
    depends_on:
      webhook-logger:
        condition: service_healthy

networks:
  chatwork-net:
    driver: bridge
