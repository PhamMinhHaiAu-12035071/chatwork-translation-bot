services:
  translator:
    image: oven/bun:1.3-alpine
    dns:
      - 1.1.1.1
      - 8.8.8.8
    # Disable IPv6 — AAAA lookups for Cloudflare-fronted APIs (OpenAI, etc.)
    # time out inside Docker Desktop on macOS, causing Bun fetch to fail.
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
    command:
      - sh
      - -c
      - bun install --frozen-lockfile && bun --hot packages/translator/src/index.ts
    working_dir: /app
    volumes:
      - .:/app
      # Shared named volume so bun install runs once (translator) and is reused by other services
      - node_modules:/app/node_modules
      # Named volume for bun cache — keeps it on fast Linux FS inside Docker (avoids re-downloading on container recreate)
      - bun_cache:/root/.bun/install/cache
    env_file:
      - .env
    environment:
      # host.docker.internal resolves to macOS host on Docker Desktop
      - CURSOR_API_URL=http://host.docker.internal:8765/v1
      # Skip husky prepare hook during in-container install
      - HUSKY=0
      # Point bun cache to the named volume (warning about slow FS on /app bind mount is cosmetic, unavoidable on macOS)
      - BUN_INSTALL_CACHE_DIR=/root/.bun/install/cache
    ports:
      - '${PORT:-3000}:3000'
    tty: true
    networks: [chatwork-net]
    # bun:1.3-alpine has wget, but use bun --eval for consistency with production
    healthcheck:
      test:
        - 'CMD'
        - 'bun'
        - '--eval'
        - "const r = await fetch('http://localhost:3000/health'); if (!r.ok) process.exit(1)"
      interval: 30s
      timeout: 10s
      retries: 3
      # First boot recreates anonymous /app/node_modules and runs bun install inside the container.
      # Give startup enough time so Compose does not mark the service unhealthy before the app listens.
      start_period: 180s

  webhook-logger:
    image: oven/bun:1.3-alpine
    dns:
      - 1.1.1.1
      - 8.8.8.8
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
    command:
      - sh
      - -c
      - bun install --frozen-lockfile && bun --hot packages/webhook-logger/src/index.ts
    working_dir: /app
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - bun_cache:/root/.bun/install/cache
    env_file:
      - .env
    environment:
      # Override localhost → Docker service name
      - TRANSLATOR_URL=http://translator:3000
      - TRANSLATOR_INTERNAL_URL=http://translator:3000
      # Skip husky prepare hook during in-container install
      - HUSKY=0
      - BUN_INSTALL_CACHE_DIR=/root/.bun/install/cache
    ports:
      - '${LOGGER_PORT:-3001}:3001'
    tty: true
    networks: [chatwork-net]
    depends_on:
      translator:
        condition: service_healthy
    healthcheck:
      test:
        - 'CMD'
        - 'bun'
        - '--eval'
        - "const r = await fetch('http://localhost:3001/health'); if (!r.ok) process.exit(1)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s

  dataset-runner:
    profiles: ['dataset']
    image: oven/bun:1.3-alpine
    dns:
      - 1.1.1.1
      - 8.8.8.8
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
    command:
      - sh
      - -c
      - bun install --frozen-lockfile && sleep ${DATASET_RUNNER_START_DELAY:-35} && bun --hot packages/dataset-runner/src/index.ts
    working_dir: /app
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - bun_cache:/root/.bun/install/cache
    env_file:
      - .env
    environment:
      - DATASET_AUTORUN=${DATASET_AUTORUN:-false}
      - HUSKY=0
      - BUN_INSTALL_CACHE_DIR=/root/.bun/install/cache
    tty: true
    networks: [chatwork-net]
    depends_on:
      translator:
        condition: service_healthy
      webhook-logger:
        condition: service_healthy
    healthcheck:
      test:
        - 'CMD'
        - 'bun'
        - '--eval'
        - "const r = await fetch('http://localhost:3002/health'); if (!r.ok) process.exit(1)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s

  # Dev gateway — nginx reverse proxy as the single entry point.
  # Routes /webhook → webhook-logger, everything else → translator (API + dashboard).
  # zrok tunnels here so one public URL serves the entire stack.
  gateway:
    image: nginx:1.27-alpine
    volumes:
      - ./config/nginx/dev.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - '${GATEWAY_PORT:-8080}:80'
    networks: [chatwork-net]
    depends_on:
      translator:
        condition: service_healthy
      webhook-logger:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:80/health']
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # zrok reserved public share — stable HTTPS URL for Chatwork webhook when available
  # If the share cannot be attached, keep local dev running without a public tunnel.
  # One-time setup: see docs/operations/zrok.md
  # Pin to a specific version for reproducibility — check https://hub.docker.com/r/openziti/zrok/tags
  zrok:
    image: openziti/zrok:1.1.11
    # Run as root so the entrypoint can write to /etc/hosts
    # (workaround for Go DNS resolver hang in Docker Desktop on macOS).
    user: '0:0'
    networks: [chatwork-net]
    dns:
      - 1.1.1.1
      - 8.8.8.8
    volumes:
      # Bind mount so host user owns the dir — named volumes create root-owned dirs
      - ./.docker/zrok:/home/ziggy/.zrok
    environment:
      - ZROK_ENABLE_TOKEN=${ZROK_ENABLE_TOKEN}
      - ZROK_UNIQUE_NAME=${ZROK_UNIQUE_NAME}
      # Keep zrok config at /home/ziggy/.zrok even when running as root
      - HOME=/home/ziggy
    entrypoint:
      - /bin/sh
      - -c
      - |
        ready_file=/tmp/zrok-share-ready
        share_fifo=/tmp/zrok-share.fifo
        reserved_file=/home/ziggy/.zrok/reserved.json
        rm -f "$$ready_file" "$$share_fifo"
        last_share_error_line=
        backend_target="http://gateway:80"
        target_marker="/home/ziggy/.zrok/backend_target"
        need_re_reserve=false
        # Auto-detect backend target change (e.g. migration from webhook-logger to gateway)
        # and force re-reservation so zrok points to the correct service.
        if [ -f "$$target_marker" ]; then
          old_target=$$(cat "$$target_marker")
          if [ "$$old_target" != "$$backend_target" ]; then
            echo "[zrok] backend target changed: $$old_target -> $$backend_target"
            need_re_reserve=true
          fi
        elif [ -f "$$reserved_file" ]; then
          echo "[zrok] no target marker — existing reservation may have stale backend"
          need_re_reserve=true
        fi
        printf '%s' "$$backend_target" > "$$target_marker"
        [ -f /home/ziggy/.zrok/environment.json ] || zrok enable "${ZROK_ENABLE_TOKEN}" --headless
        # Pre-resolve OpenZiti controller hostname to /etc/hosts.
        # Go's built-in DNS resolver can hang inside Docker Desktop on macOS;
        # pinning the IP here avoids the timeout on `zrok share reserved`.
        _zt_identity=/home/ziggy/.zrok/identities/environment.json
        if [ -f "$$_zt_identity" ]; then
          _zt_host=$$(sed -n 's/.*"ztAPI":"https:\/\/\([^:/]*\).*/\1/p' "$$_zt_identity")
          if [ -n "$$_zt_host" ]; then
            _zt_ip=$$(getent hosts "$$_zt_host" 2>/dev/null | awk '{print $$1}')
            if [ -n "$$_zt_ip" ]; then
              printf '%s %s\n' "$$_zt_ip" "$$_zt_host" >> /etc/hosts
              echo "[zrok] pre-resolved $$_zt_host -> $$_zt_ip"
            fi
          fi
        fi
        # zrok v1 reserved shares require an alphanumeric unique name and a share token.
        normalized_unique_name=$$(printf '%s' "${ZROK_UNIQUE_NAME}" | tr '[:upper:]' '[:lower:]' | tr -cd '[:alnum:]')
        if [ "$$normalized_unique_name" != "${ZROK_UNIQUE_NAME}" ]; then
          echo "[zrok] normalized unique name: ${ZROK_UNIQUE_NAME} -> $$normalized_unique_name"
        fi
        if [ $${#normalized_unique_name} -gt 32 ]; then
          truncated_unique_name=$$(printf '%s' "$$normalized_unique_name" | cut -c1-32)
          echo "[zrok] truncated unique name to v1 limit: $$normalized_unique_name -> $$truncated_unique_name"
          normalized_unique_name="$$truncated_unique_name"
        fi
        if [ -z "$$normalized_unique_name" ] || [ $${#normalized_unique_name} -lt 4 ]; then
          last_share_error_line='[ERROR]: normalized zrok unique name is too short; set ZROK_UNIQUE_NAME to at least 4 alphanumeric characters'
          share_status=1
        else
          extract_share_token() {
            sed -n 's/.*"token":"\([^"]*\)".*/\1/p' "$$1" | head -n 1
          }
          reserve_share() {
            reserve_output=$$(zrok reserve public $$backend_target --unique-name "$$normalized_unique_name" --json-output 2>&1)
            reserve_status=$$?
            if [ $$reserve_status -eq 0 ]; then
              printf '%s\n' "$$reserve_output" > "$$reserved_file"
              share_token=$$(extract_share_token "$$reserved_file")
              return 0
            fi
            if printf '%s\n' "$$reserve_output" | grep -q 'shareConflict'; then
              if [ "$$need_re_reserve" = true ]; then
                echo "[zrok] stale server reservation — releasing and retrying"
                zrok release "$$normalized_unique_name" 2>&1 || true
                reserve_output=$$(zrok reserve public $$backend_target --unique-name "$$normalized_unique_name" --json-output 2>&1)
                reserve_status=$$?
                if [ $$reserve_status -eq 0 ]; then
                  printf '%s\n' "$$reserve_output" > "$$reserved_file"
                  share_token=$$(extract_share_token "$$reserved_file")
                  return 0
                fi
                last_share_error_line="$$reserve_output"
                return 1
              fi
              # zrok v1 returns the unique name itself as the reserved share token for unique-name reservations.
              printf '{"token":"%s"}\n' "$$normalized_unique_name" > "$$reserved_file"
              share_token="$$normalized_unique_name"
              return 0
            fi
            last_share_error_line="$$reserve_output"
            return 1
          }
          stream_reserved_share() {
            rm -f "$$share_fifo"
            mkfifo "$$share_fifo"
            echo "[zrok] starting reserved share bridge for $$normalized_unique_name"
            zrok share reserved "$$share_token" --headless >"$$share_fifo" 2>&1 &
            share_pid=$$!
            last_share_error_line=
            while IFS= read -r line; do
              case "$$line" in
                *"[ERROR]:"*)
                  last_share_error_line="$$line"
                  continue
                  ;;
              esac
              echo "$$line"
              url=$$(echo "$$line" | grep -o 'https://[a-zA-Z0-9-]*\.share[s]*\.zrok\.io' 2>/dev/null)
              if [ -n "$$url" ]; then
                touch "$$ready_file"
                echo ""
                echo "============================================="
                echo " PUBLIC URL  : $$url"
                echo ""
                echo " Dashboard   : $$url/"
                echo " API         : $$url/api/rooms"
                echo " Webhook     : $$url/webhook"
                echo "   -> Chatwork : Webhook settings -> URL"
                echo "============================================="
                echo ""
              fi
            done <"$$share_fifo"
            wait "$$share_pid"
            share_status=$$?
            rm -f "$$share_fifo"
            return $$share_status
          }
          if [ "$$need_re_reserve" = true ] && [ -f "$$reserved_file" ]; then
            old_token=$$(extract_share_token "$$reserved_file")
            if [ -n "$$old_token" ]; then
              echo "[zrok] releasing stale reservation: $$old_token"
              zrok release "$$old_token" 2>&1 || true
            fi
            rm -f "$$reserved_file"
          fi
          share_token=
          if [ -f "$$reserved_file" ]; then
            share_token=$$(extract_share_token "$$reserved_file")
          fi
          if [ -z "$$share_token" ]; then
            echo "[zrok] ensuring reserved share exists: $$normalized_unique_name"
            if ! reserve_share; then
              share_status=1
            fi
          fi
          if [ -n "$$share_token" ]; then
            stream_reserved_share
            share_status=$$?
            if [ $$share_status -ne 0 ] && [ -n "$$last_share_error_line" ] && printf '%s\n' "$$last_share_error_line" | grep -q 'getShareDetailNotFound'; then
              echo "[zrok] reserved share token is stale, recreating reservation for $$normalized_unique_name"
              rm -f "$$reserved_file"
              share_token=
              echo "[zrok] ensuring reserved share exists: $$normalized_unique_name"
              if reserve_share; then
                stream_reserved_share
                share_status=$$?
              else
                share_status=1
              fi
            fi
          fi
        fi
        echo ""
        echo "============================================="
        if [ -f "$$ready_file" ]; then
          echo " ZROK TUNNEL OFFLINE"
          echo " local dev will continue without a public tunnel."
          echo " Fix the zrok share issue, then restart the stack when needed."
        else
          if [ -n "$$last_share_error_line" ]; then
            echo "$$last_share_error_line"
            echo ""
          fi
          echo " ZROK SHARE FAILED"
          echo " local dev will continue without a public tunnel."
          echo " zrok share reserved exited with status $$share_status."
        fi
        echo "============================================="
        echo ""
        tail -f /dev/null
    depends_on:
      gateway:
        condition: service_healthy

networks:
  chatwork-net:
    driver: bridge

volumes:
  # Shared node_modules: translator installs once, other services reuse instantly
  node_modules:
  # Bun package cache on fast Linux FS — survives container recreations, avoids re-downloading packages
  bun_cache:
