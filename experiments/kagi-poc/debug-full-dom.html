		<!-- Prevent flash of wrong theme - minimal script that only handles dark mode detection -->
		<script>
			// DEBUGGING: Log timing

			(function () {
				// This script only prevents flash of white content
				// Full theme management is handled by ThemeManager.svelte
				try {
					// DEBUGGING: Log initial state
					console.log('[THEME DEBUG] Initial state:', {
						time: performance.now(),
						documentElement: document.documentElement,
						classList: document.documentElement ? document.documentElement.className : 'documentElement not ready',
						computedBg: window.getComputedStyle(document.documentElement).backgroundColor,
						bodyExists: !!document.body,
						readyState: document.readyState
					});

					// Check if we're in a browser environment
					if (typeof window === 'undefined') return;

					// Inline mobile detection function since we can't import modules here
					function isMobileDevice() {
						const userAgent = window.navigator.userAgent || '';
						const mobilePatterns = [
							/Android/i,
							/webOS/i,
							/iPhone/i,
							/iPad/i,
							/iPod/i,
							/BlackBerry/i,
							/Windows Phone/i,
							/Mobile/i,
							/Tablet/i
						];

						const isMobile = mobilePatterns.some((pattern) => pattern.test(userAgent));
						const hasTouch = 'maxTouchPoints' in navigator && navigator.maxTouchPoints > 1;
						const isProbablyIPad =
							hasTouch && /Macintosh/i.test(userAgent) && 'ontouchend' in document;

						return isMobile || isProbablyIPad;
					}

					const isMobile = isMobileDevice();

					// Valid theme values
					const VALID_THEMES = ['theme_light', 'light_default', 'theme_dark', 'dark_default', 'system_default'];
					
					// Function to validate and clean theme value
					function validateTheme(themeValue, storageKey) {
						if (!themeValue) return null;
						
						// Remove quotes if present (from JSON storage)
						const cleanValue = themeValue.replace(/^["']|["']$/g, '');
						
						// Check if it's a valid theme
						if (!VALID_THEMES.includes(cleanValue)) {
							console.warn(`[THEME CLEANUP] Invalid theme "${themeValue}" in ${storageKey}, removing...`);
							localStorage.removeItem(storageKey);
							return null;
						}
						
						// If we cleaned the value (removed quotes), save it back
						if (cleanValue !== themeValue) {
							console.log(`[THEME CLEANUP] Fixed quoted value in ${storageKey}: "${themeValue}" -> "${cleanValue}"`);
							try {
								localStorage.setItem(storageKey, cleanValue);
							} catch (e) {
								console.warn('[THEME DEBUG] Could not save to localStorage:', storageKey);
							}
						}
						
						return cleanValue;
					}

					// Safely get from localStorage with fallback
					function safeGetItem(key) {
						try {
							return localStorage.getItem(key);
						} catch (e) {
							console.warn('[THEME DEBUG] localStorage not available for key:', key);
							return null;
						}
					}

					// Get theme from localStorage only (no cookies needed)
					const storedThemeOverride = validateTheme(
						safeGetItem('kagi_theme_override'), 
						'kagi_theme_override'
					);
					const storedMobileThemeOverride = validateTheme(
						safeGetItem('kagi_mobile_theme_override'),
						'kagi_mobile_theme_override'
					);
					const storedTheme = validateTheme(
						safeGetItem('kagi_theme'),
						'kagi_theme'
					);
					const storedMobileTheme = validateTheme(
						safeGetItem('kagi_mobile_theme'),
						'kagi_mobile_theme'
					);

					// DEBUGGING: Log localStorage values
					let allLocalStorage = {};
					try {
						allLocalStorage = Object.keys(localStorage).reduce((acc, key) => {
							if (key.includes('theme') || key.includes('kagi')) {
								acc[key] = safeGetItem(key);
							}
							return acc;
						}, {});
					} catch (e) {
						console.warn('[THEME DEBUG] Could not access localStorage keys');
					}
					
					console.log('[THEME DEBUG] localStorage values:', {
						time: performance.now(),
						storedThemeOverride,
						storedMobileThemeOverride,
						storedTheme,
						storedMobileTheme,
						allLocalStorage
					});

					// Apply theme with strict priority order
					// 1. User override (from Settings)
					// 2. Cached session theme 
					// 3. System preference
					let themeToUse = null;
					let darkModePreferred = false;

					// First check for user overrides (highest priority)
					if (isMobile && storedMobileThemeOverride) {
						themeToUse = storedMobileThemeOverride;
						console.log('[THEME DEBUG] Using mobile override:', storedMobileThemeOverride);
					} else if (!isMobile && storedThemeOverride) {
						themeToUse = storedThemeOverride;
						console.log('[THEME DEBUG] Using desktop override:', storedThemeOverride);
					}
					// If no overrides, check cached session theme
					else if (isMobile && storedMobileTheme) {
						themeToUse = storedMobileTheme;
						console.log('[THEME DEBUG] Using cached mobile session theme:', storedMobileTheme);
					} else if (!isMobile && storedTheme) {
						themeToUse = storedTheme;
						console.log('[THEME DEBUG] Using cached desktop session theme:', storedTheme);
					}

					// DEBUGGING: Log theme selection process
					console.log('[THEME DEBUG] Theme selection:', {
						time: performance.now(),
						isMobile,
						themeToUse,
						willCheckSystemPref: !themeToUse || themeToUse === 'system_default'
					});

					// Determine theme mode
					let isExplicitLight = false;
					let isExplicitDark = false;
					
					// If we have a theme and it's not system_default, use it
					if (themeToUse && themeToUse !== 'system_default') {
						isExplicitDark = themeToUse.includes('dark');
						isExplicitLight = themeToUse.includes('light');
						darkModePreferred = isExplicitDark;
						console.log('[THEME DEBUG] Using explicit theme:', {
							time: performance.now(),
							themeToUse,
							isExplicitDark,
							isExplicitLight,
							darkModePreferred
						});
					} else {
						// No explicit theme set, fall back to system preference
						const darkMediaQuery = window.matchMedia('(prefers-color-scheme: dark)');
						darkModePreferred = darkMediaQuery.matches;
					}

					console.log('Theme detection:', {
						isMobile,
						storedThemeOverride,
						storedMobileThemeOverride,
						storedTheme,
						storedMobileTheme,
						systemPrefersDark: window.matchMedia('(prefers-color-scheme: dark)').matches,
						prefersColorScheme: window.matchMedia('(prefers-color-scheme: dark)').matches

							: 'light',
						darkModePreferred
					});

					// DEBUGGING: Log before applying theme
					console.log('[THEME DEBUG] Before applying theme:', {
						time: performance.now(),
						darkModePreferred,
						currentClasses: document.documentElement.className,
						computedBg: window.getComputedStyle(document.documentElement).backgroundColor,
						pathname: window.location.pathname

					// Apply theme classes
					if (isExplicitDark || (darkModePreferred && !isExplicitLight)) {
						console.log('[THEME DEBUG] Adding dark class at:', performance.now(), 'ms');
						document.documentElement.classList.add('dark');
					} else if (isExplicitLight) {
						console.log('[THEME DEBUG] Adding light class at:', performance.now(), 'ms');
						document.documentElement.classList.add('light');
					}

					// Update theme-color meta tag immediately
					const themeColorMeta = document.getElementById('theme-color-meta');
					if (themeColorMeta) {
						const newColor = darkModePreferred ? '#232325' : '#ffffff';
						themeColorMeta.content = newColor;
						console.log('[THEME DEBUG] Theme-color meta updated:', newColor);
					}
				} catch (e) {
					console.error('[THEME DEBUG] Theme detection error:', e);
				}
			})();
		</script>
