# Dev gateway — single entry point for translator (API + dashboard) and webhook-logger.
# Used by the gateway service in docker-compose.dev.yml.
# zrok tunnels to this nginx so one public URL serves everything.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location = /webhook {
        proxy_pass http://webhook-logger:3001;
    }

    location /api/ {
        proxy_pass http://translator:3000;
    }

    location /health {
        proxy_pass http://translator:3000;
    }

    location /docs {
        proxy_pass http://translator:3000;
    }

    location / {
        proxy_pass http://dashboard:5173;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
